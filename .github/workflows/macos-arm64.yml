name: Build macOS Apple Silicon installer

# Manual native build; all checks must pass before an automatic public prerelease.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: macos-arm64-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS 15 · Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set fixed Beijing build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-version.ts --github-env --github-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@stable
      - name: Require native ARM64 build tools
        run: |
          test "$(uname -m)" = arm64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
          python -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64"; print(sys.version); print(platform.platform())'
          rustc -vV
          xcrun --show-sdk-path
          # Reuse this exact setup-python interpreter when creating the venv.
          printf 'SHIFT_FLOW_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare local Python solver
        run: npm run solver:ensure -- --dev
      - name: Test frontend rules and process helpers
        run: npm test
      - name: Type-check and build the Vue interface
        run: npm run build
      - name: Test real CP-SAT constraints
        run: npm run solver:test
      - name: Build and self-test complete ARM64 runtime
        run: npm run solver:build
      - name: Test Rust process lifecycle
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Verify development Python integration
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib python_source_solver_solves_real_schedule -- --ignored --nocapture
      - name: Verify directory runtime integration
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib frozen_sidecar_solves_real_schedule -- --ignored --nocapture
      - name: Build app and DMG
        run: npm run desktop:build -- --bundles app,dmg
      - name: Verify sealed app signature and bundled solver
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, mkdirSync, writeFileSync, readFileSync } from 'node:fs';
          import { resolve, join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { captureFrozen, parseFrozenInfo } from './scripts/frozen-process.mjs';
          import { verifyMacSignature } from './scripts/verify-macos-signature.mjs';
          import { validateBuildVersion } from './scripts/build-version.ts';

          const buildVersion = validateBuildVersion(process.env.SHIFT_FLOW_BUILD_VERSION);
          if (JSON.parse(readFileSync('dist/build-info.json', 'utf8')).buildVersion !== buildVersion) throw new Error('Compiled UI build number differs from workflow');
          const bundleDirectory = resolve('src-tauri/target/release/bundle/macos');
          const apps = readdirSync(bundleDirectory).filter(name => name.endsWith('.app'));
          if (apps.length !== 1) throw new Error(`Expected one app bundle, found ${apps.length}`);
          const app = join(bundleDirectory, apps[0]);
          const signature = verifyMacSignature(app);
          const runtime = join(app, 'Contents', 'Resources', 'solver-runtime');
          const solver = join(runtime, 'shiftflow-solver');
          const main = join(app, 'Contents', 'MacOS', 'shift-flow-desktop');
          const architecture = executable => {
            const result = execFileSync('/usr/bin/file', ['-b', executable], { encoding: 'utf8' }).trim();
            if (!result.includes('arm64')) throw new Error(`Not an ARM64 executable: ${executable}: ${result}`);
            return result;
          };
          const mainArchitecture = architecture(main);
          const solverArchitecture = architecture(solver);
          const infoRun = await captureFrozen(solver, ['--info', '--hosted'], { cwd: runtime });
          const info = parseFrozenInfo(infoRun);
          const testRun = await captureFrozen(solver, ['--self-test', '--hosted'], { cwd: runtime });
          const selfTest = parseFrozenInfo(testRun, true);
          const report = {
            target: 'aarch64-apple-darwin', os: 'macos-15',
            commit: process.env.GITHUB_SHA, buildVersion, generatedAt: new Date().toISOString(),
            mainArchitecture, solverArchitecture, info, selfTest,
            startupSeconds: infoRun.elapsedSeconds, selfTestSeconds: testRun.elapsedSeconds,
            checkedInstalledResourceLayout: true,
            signature, adHocSigned: true, developerIdSigned: false, notarized: false,
          };
          mkdirSync('artifacts', { recursive: true });
          writeFileSync('artifacts/macos-signature-validation.json', `${JSON.stringify(signature, null, 2)}\n`);
          writeFileSync('artifacts/native-validation.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Audit final app structure and macOS 14 compatibility floor
        run: |
          apps=(src-tauri/target/release/bundle/macos/*.app)
          test "${#apps[@]}" -eq 1
          python scripts/audit-macos-app.py "${apps[0]}" > artifacts/macos-app-audit.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/macos-app-audit.json', 'utf8'));
          const compare = (left, right) => {
            const a = String(left).split('.').map(Number);
            const b = String(right).split('.').map(Number);
            assert.ok(a.length <= 3 && b.length <= 3 && a.every(Number.isInteger) && b.every(Number.isInteger));
            for (let index = 0; index < 3; index++) {
              const difference = (a[index] || 0) - (b[index] || 0);
              if (difference) return Math.sign(difference);
            }
            return 0;
          };
          assert.equal(report.validation.passed, true);
          assert.deepEqual(report.validation.errors, []);
          assert.equal(report.summary.all_macho_objects_contain_arm64, true);
          assert.equal(report.summary.all_symlinks_internal_and_resolvable, true);
          assert.equal(compare(report.minimum_system_assessment.effective_declared_arm64_minimum, '14.0'), 0, 'App must declare macOS 14 as its minimum');
          assert.ok(report.summary.macos_arm64_max_minos, 'Missing native dependency minimum OS information');
          assert.ok(compare(report.summary.macos_arm64_max_minos, '14.0') <= 0, 'Bundled dependencies require newer than the advertised macOS 14 minimum');
          assert.equal(report.minimum_system_assessment.declaration_understates_observed_minimum, false);
          console.log(JSON.stringify(report.summary, null, 2));
          NODE
      - name: Verify hour limits and weekday weights through the final app runtime
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, writeFileSync } from 'node:fs';
          import { resolve, join } from 'node:path';
          import { captureFrozen } from './scripts/frozen-process.mjs';
          import { verifyScheduleFixtures } from './scripts/verify-desktop-bundle.mjs';
          import { validateBuildVersion } from './scripts/build-version.ts';
          const directory = resolve('src-tauri/target/release/bundle/macos');
          const apps = readdirSync(directory).filter(name => name.endsWith('.app'));
          assert.equal(apps.length, 1);
          const runtime = join(directory, apps[0], 'Contents', 'Resources', 'solver-runtime');
          const { state, result, execution, independentRuleIssues, constraintChecks } = await verifyScheduleFixtures(
            request => captureFrozen(join(runtime, 'shiftflow-solver'), ['--hosted'], {
              cwd: runtime, input: JSON.stringify(request),
              startupTimeoutMs: 120_000, solveTimeoutMs: 20_000, finishTimeoutMs: 5_000,
            }),
            `macos-release-${process.env.GITHUB_RUN_ID}`,
          );
          const report = {
            buildCommit: process.env.GITHUB_SHA, buildRun: process.env.GITHUB_RUN_ID,
            buildVersion: validateBuildVersion(process.env.SHIFT_FLOW_BUILD_VERSION),
            target: 'aarch64-apple-darwin', fixture: '12-person staffing fixture with zero hour minimums; no user data',
            month: state.month, employeeCount: 12, shiftsPerDay: [2, 2, 1], searchLimitSeconds: 5,
            status: result.status, assignmentCount: result.assignments.length,
            shortageCount: result.stats.shortageCount, independentRuleIssues, constraintChecks,
            solverStats: result.stats, elapsedSeconds: execution.elapsedSeconds,
            stages: execution.stages, checkedAppRuntime: true,
          };
          writeFileSync('artifacts/macos-month-schedule-validation.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Archive app preserving links and copy installer
        run: |
          apps=(src-tauri/target/release/bundle/macos/*.app)
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#dmgs[@]}" -eq 1
          # ditto preserves the app's links and metadata; upload the archive, not loose app files.
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" artifacts/shift-flow-macos-arm64.app.zip
          cp "${dmgs[0]}" artifacts/shift-flow-macos-arm64.dmg
          cp solver/build/aarch64-apple-darwin/manifest.json artifacts/solver-manifest.json
          git archive --format=zip --prefix=shift-planner/ --output=artifacts/shift-planner-source.zip "$GITHUB_SHA"
          shasum -a 256 artifacts/*.dmg artifacts/*.zip > artifacts/SHA256SUMS
          # Public checksums cover the installer and source only; diagnostics stay in Actions.
          (
            cd artifacts
            shasum -a 256 shift-flow-macos-arm64.dmg shift-planner-source.zip
          ) > artifacts/release-SHA256SUMS
          (
            cd artifacts
            shasum -a 256 -c release-SHA256SUMS
          )
      - name: Upload verified ARM64 installer and app archive
        uses: actions/upload-artifact@v4
        with:
          name: shift-flow-macos-arm64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: artifacts/
      - name: Publish verified installer and source as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          tag="macos-arm64-v${version}-${GITHUB_RUN_ID}"
          cat > release-notes.md <<EOF
          排班 plus ${version} · Apple Silicon 测试发行版

          构建号：${SHIFT_FLOW_BUILD_VERSION}（北京时间）

          适用于 M 系列芯片的 Mac，要求 macOS 14 或更新系统；在 macOS 15 ARM64 原生构建并验证。
          本版本未进行 Apple Developer ID 签名或 Apple 公证。
          已进行 ad-hoc 签名并验证完整 App 的资源封印；首次运行仍可能需要在 macOS「隐私与安全性」中为此应用单独批准打开。

          下载 shift-flow-macos-arm64.dmg 即可安装，内含 Python 和 OR-Tools，无需另装算法环境。
          shift-planner-source.zip 为本次构建提交的精确源码；无需重复下载 Actions 中的 App ZIP。
          release-SHA256SUMS 可用于校验安装包和源码 ZIP。原生资源、求解验证和构建清单等 JSON 报告保存在本次 Actions 的 shift-flow-macos-arm64 artifact 中（保留 14 天），不作为 Release 下载附件。

          发布前已通过前端、Python 与 Rust 测试、最终 App 原生资源审计及完整月份真实求解验证：12 人、155 条安排、0 缺员、独立规则检查无问题。
          原生依赖最低系统版本已核对；这不代表已在每个 macOS 14+ 系统版本上进行实机测试。

          源码提交：${GITHUB_SHA}
          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          # --target does not override an existing Git tag: verify it before creating a release.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > existing-tag.json 2> tag-check-error.txt; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)" = "$GITHUB_SHA"
          elif ! grep -q 'HTTP 404' tag-check-error.txt; then
            cat tag-check-error.txt >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,tagName,url > existing-release.json; then
            # Reuse only a release from this exact source; never replace published attachments.
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('existing-release.json', 'utf8'));
          assert.equal(release.targetCommitish, process.env.GITHUB_SHA, 'Existing tag targets a different source commit');
          assert.equal(release.isPrerelease, true, 'Refusing to change an existing stable release');
          console.log(`Checking existing prerelease without replacing assets: ${release.url}`);
          NODE
          else
            # Upload while still a draft so a failed upload cannot publish an incomplete release.
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "排班 plus ${version} · M 芯片 · macOS 14+（未公证）" --notes-file release-notes.md artifacts/shift-flow-macos-arm64.dmg artifacts/shift-planner-source.zip artifacts/release-SHA256SUMS
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,assets > release-ready.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release-ready.json', 'utf8'));
          assert.equal(release.targetCommitish, process.env.GITHUB_SHA);
          assert.equal(release.isPrerelease, true);
          const required = ['shift-flow-macos-arm64.dmg', 'shift-planner-source.zip', 'release-SHA256SUMS'];
          assert.equal(release.assets.length, required.length, 'Unexpected public attachments; diagnostics belong in Actions artifacts');
          for (const name of required) {
            const assets = release.assets.filter(asset => asset.name === name);
            assert.equal(assets.length, 1, `Incomplete release: missing or duplicate ${name}; refusing publication`);
            assert.ok(assets[0].size > 0, `Empty attachment: ${name}; refusing publication`);
          }
          NODE
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)" = "$GITHUB_SHA"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,url,assets
